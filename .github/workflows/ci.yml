name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Real key is not needed for a build check — Gemini calls move to the
          # backend before V1. A placeholder keeps Vite happy at build time.
          GEMINI_API_KEY: placeholder
